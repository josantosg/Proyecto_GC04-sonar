<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Revisa tu correo · ErasmusNest</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
        a:focus { outline: 3px solid #1d4ed8; outline-offset: 2px; }
    </style>
</head>
<body>
<main>
    <h1>Revisa tu correo</h1>
    <!-- Mismo mensaje exista o no la cuenta: no revela si el correo está registrado (US-001-AC-03) -->
    <output th:text="${mensaje != null} ? ${mensaje} : 'Si el correo es válido, recibirás un enlace'"></output>
    <p><a th:href="@{/}">Volver al inicio</a></p>
</main>
</body>
</html>
